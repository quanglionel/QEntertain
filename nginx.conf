worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # === Gzip compression ===
    gzip on;
    gzip_types application/json text/css application/javascript text/html;
    gzip_min_length 256;

    # === Proxy cache để tăng tốc ===
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=api_cache:20m max_size=500m inactive=60m;

    server {
        listen 80;
        server_name localhost;

        # === Serve static files (HTML/CSS/JS) ===
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # === Proxy OPhim API (tránh CORS) ===
        location /api/phim/ {
            proxy_pass https://ophim1.com/v1/api/;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;
            resolver 8.8.8.8;

            proxy_set_header Host ophim1.com;
            proxy_set_header Origin "";
            proxy_set_header Referer "";

            # Cache 5 phút
            proxy_cache api_cache;
            proxy_cache_valid 200 5m;

            # Headers cho client
            add_header Access-Control-Allow-Origin *;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # === Proxy OTruyen API (tránh CORS) ===
        location /api/truyen/ {
            proxy_pass https://otruyenapi.com/v1/api/;
            proxy_set_header Host otruyenapi.com;
            proxy_set_header Origin "";
            proxy_set_header Referer "";
            proxy_ssl_server_name on;

            # Cache 5 phút
            proxy_cache api_cache;
            proxy_cache_valid 200 5m;

            # Headers cho client
            add_header Access-Control-Allow-Origin *;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # === Proxy OTruyen Chapter API (sv1.otruyencdn.com) ===
        location /api/truyen-chapter/v1/api/ {
            # Rewrite /api/truyen-chapter/v1/api/... đến /v1/api/...
            rewrite ^/api/truyen-chapter/(.*)$ /$1 break;
            
            proxy_pass https://sv1.otruyencdn.com;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;
            resolver 8.8.8.8;
            
            proxy_set_header Host sv1.otruyencdn.com;
            proxy_set_header Origin "";
            proxy_set_header Referer "";
            
            # Cache chapter data 30 phút (JSON nhẹ, tải nhanh lần 2)
            proxy_cache api_cache;
            proxy_cache_valid 200 30m;
            
            # CORS
            add_header Access-Control-Allow-Origin *;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # === Proxy ảnh truyện CDN (sv1.otruyencdn.com) - cache lâu ===
        location /api/truyen-chapter/ {
            rewrite ^/api/truyen-chapter/(.*)$ /$1 break;
            
            proxy_pass https://sv1.otruyencdn.com;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;
            resolver 8.8.8.8;
            
            proxy_set_header Host sv1.otruyencdn.com;
            proxy_set_header Origin "";
            proxy_set_header Referer "";
            
            # Cache ảnh 2 giờ
            proxy_cache api_cache;
            proxy_cache_valid 200 2h;
            expires 2h;
            
            add_header Access-Control-Allow-Origin *;
        }

        # === Proxy ảnh phim ===
        location /img/phim/ {
            proxy_pass https://img.ophim.live/uploads/movies/;
            proxy_set_header Host img.ophim.live;
            proxy_ssl_server_name on;
            proxy_cache api_cache;
            proxy_cache_valid 200 1h;
            expires 1h;
        }

        # === Proxy ảnh truyện ===
        location /img/truyen/ {
            proxy_pass https://img.otruyenapi.com/uploads/comics/;
            proxy_set_header Host img.otruyenapi.com;
            proxy_ssl_server_name on;
            proxy_cache api_cache;
            proxy_cache_valid 200 1h;
            expires 1h;
        }
    }
}