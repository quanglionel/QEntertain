worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # === Proxy cache để tăng tốc ===
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=30m;

    server {
        listen 80;
        server_name localhost;

        # === Serve static files (HTML/CSS/JS) ===
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # === Proxy OPhim API (tránh CORS) ===
        location /api/phim/ {
            proxy_pass https://ophim1.com/v1/api/;
            proxy_set_header Host ophim1.com;
            proxy_set_header Origin "";
            proxy_set_header Referer "";
            proxy_ssl_server_name on;

            # Cache 5 phút
            proxy_cache api_cache;
            proxy_cache_valid 200 5m;

            # Headers cho client
            add_header Access-Control-Allow-Origin *;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # === Proxy OTruyen API (tránh CORS) ===
        location /api/truyen/ {
            proxy_pass https://otruyenapi.com/v1/api/;
            proxy_set_header Host otruyenapi.com;
            proxy_set_header Origin "";
            proxy_set_header Referer "";
            proxy_ssl_server_name on;

            # Cache 5 phút
            proxy_cache api_cache;
            proxy_cache_valid 200 5m;

            # Headers cho client
            add_header Access-Control-Allow-Origin *;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # === Proxy ảnh phim ===
        location /img/phim/ {
            proxy_pass https://img.ophim.live/uploads/movies/;
            proxy_set_header Host img.ophim.live;
            proxy_ssl_server_name on;
            proxy_cache api_cache;
            proxy_cache_valid 200 1h;
            expires 1h;
        }

        # === Proxy ảnh truyện ===
        location /img/truyen/ {
            proxy_pass https://img.otruyenapi.com/uploads/comics/;
            proxy_set_header Host img.otruyenapi.com;
            proxy_ssl_server_name on;
            proxy_cache api_cache;
            proxy_cache_valid 200 1h;
            expires 1h;
        }
    }
}
