<!DOCTYPE html>
<html lang="vi" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="QPhim - Xem phim trực tuyến miễn phí, chất lượng cao">
    <title>QPhim - Xem Phim Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/movies.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/detail.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <!-- Các container - nội dung render bằng JS -->
    <header class="header" id="header"></header>

    <section class="hero" id="hero">
        <div class="hero-slides" id="heroSlides"></div>
        <div class="hero-nav" id="heroNav"></div>
        <button class="hero-arrow hero-prev" id="heroPrev" aria-label="Trước">‹</button>
        <button class="hero-arrow hero-next" id="heroNext" aria-label="Sau">›</button>
    </section>

    <main class="main-content" id="movieSections"></main>
    <footer class="footer" id="footer"></footer>

    <!-- Detail & Player Overlay -->
    <div id="detailPage" class="detail-page hidden">
        <div class="detail-backdrop"></div>
        <button class="close-detail" id="closeDetailBtn" aria-label="Đóng">✕</button>
        <div class="detail-container">
            <div class="detail-content" id="detailContent">
                <!-- Nội dung chi tiết render bằng JS -->
                <div class="loading-spinner">Đang tải...</div>
            </div>
        </div>
    </div>

    <!-- HLS.js cho Player -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

    <!-- JavaScript -->
    <script src="js/data.js"></script>
    <script src="js/api.js"></script>
    <script src="js/player.js"></script>
    <script src="js/components.js"></script>
    <script src="js/slider.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/search.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
