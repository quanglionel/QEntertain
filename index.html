<!DOCTYPE html>
<html lang="vi" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description"
        content="QPhim - Xem phim online, Đọc truyện tranh miễn phí chất lượng cao. Kho phim truyện phong phú, cập nhật liên tục.">
    <meta name="keywords" content="xem phim, phim online, đọc truyện, truyện tranh, qphim, qtruyen, phim mới">
    <meta name="author" content="QHub Team">
    <meta name="theme-color" content="#1a1a1a">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://qphim.pages.dev/">
    <meta property="og:title" content="QPhim - Xem Phim & Đọc Truyện Online">
    <meta property="og:description"
        content="Trải nghiệm giải trí đỉnh cao với kho phim và truyện khổng lồ. Giao diện hiện đại, không quảng cáo.">
    <meta property="og:image" content="https://qphim.pages.dev/img/icon-512.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://qphim.pages.dev/">
    <meta property="twitter:title" content="QPhim - Xem Phim & Đọc Truyện Online">
    <meta property="twitter:description"
        content="Trải nghiệm giải trí đỉnh cao với kho phim và truyện khổng lồ. Giao diện hiện đại, không quảng cáo.">
    <meta property="twitter:image" content="https://qphim.pages.dev/img/icon-512.png">

    <title>QPhim - Xem Phim & Đọc Truyện</title>
    <meta name="referrer" content="no-referrer">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/img/icon-192.png">
    <title>QPhim - Xem Phim Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css?v=18">
    <link rel="stylesheet" href="css/header.css?v=18">
    <link rel="stylesheet" href="css/hero.css?v=18">
    <link rel="stylesheet" href="css/movies.css?v=18">
    <link rel="stylesheet" href="css/footer.css?v=18">
    <link rel="stylesheet" href="css/detail.css?v=18">
    <link rel="stylesheet" href="css/watch.css?v=18">
    <link rel="stylesheet" href="css/chapter_list.css?v=18">
    <link rel="stylesheet" href="css/responsive.css?v=18">
    <link rel="stylesheet" href="css/mobile-nav.css?v=1">
    <link rel="stylesheet" href="css/notification.css?v=18">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#141414">
</head>

<body>
    <!-- App Container -->
    <div id="app">
        <!-- Sidebar Overlay (Mobile) -->
        <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar(false)"></div>

        <!-- Sidebar Content -->
        <div id="sidebar" class="sidebar"></div>

        <!-- Header -->
        <header id="header" class="header"></header>

        <!-- Hero Slider -->
        <div id="hero" class="hero-slider"></div>

        <!-- Filter Bar -->
        <div id="filterBar" class="filter-bar"></div>

        <!-- Main Content -->
        <main id="movieSections" class="main-content"></main>
    </div>

    <!-- Detail Overlay -->
    <div id="detailPage" class="detail-page hidden">
        <div class="detail-backdrop" onclick="closeDetail()"></div>
        <div class="close-detail" id="closeDetailBtn" onclick="closeDetail()">×</div>

        <div class="detail-container">
            <div id="detailContent"></div>
        </div>
    </div>

    <!-- Watch Page (Movies) -->
    <div id="watchPage" class="detail-page hidden" style="z-index: 2005;">
        <div class="detail-backdrop"></div>
        <div class="detail-container" style="max-width: 1400px; padding-top: 20px;">
            <div class="watch-header" style="margin-bottom: 20px; display: flex; align-items: center; gap: 15px;">
                <button id="watchBackBtn" class="nav-btn"
                    style="background:rgba(255,255,255,0.1);border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:1.2rem;cursor:pointer;">←</button>
                <h2 id="watchTitle" style="margin:0;font-size:1.2rem;flex:1;">Đang xem phim...</h2>
            </div>
            <div class="watch-layout" style="display: flex; gap: 20px; flex-wrap: wrap;">
                <div class="watch-player-col" style="flex: 1; min-width: 300px;">
                    <div id="watchPlayerContainer" class="video-container" style="background:#000;aspect-ratio:16/9;">
                    </div>
                    <div class="watch-controls"
                        style="margin-top: 15px; display: flex; justify-content: space-between; align-items: center;">
                        <div class="auto-next">
                            <label
                                style="display:flex;align-items:center;gap:8px;cursor:pointer;color:#ccc;font-size:0.9rem;">
                                <input type="checkbox" id="autoNextToggle" checked> Tự chuyển tập
                            </label>
                        </div>
                        <div class="server-error-report">
                            <button onclick="alert('Đã báo lỗi!')"
                                style="background:none;border:1px solid #444;color:#888;padding:5px 10px;border-radius:4px;font-size:0.8rem;cursor:pointer;">Báo
                                lỗi</button>
                        </div>
                    </div>
                </div>
                <div class="watch-list-col"
                    style="width: 350px; flex-shrink: 0; background: var(--bg-card); border-radius: 8px; border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; max-height: 80vh;">
                    <div style="padding: 15px; border-bottom: 1px solid var(--border); font-weight: 700;">Danh sách tập
                    </div>
                    <div id="watchEpisodeList" style="flex: 1; overflow-y: auto; padding: 10px;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Reader Page (Comics) -->
    <div id="readerPage" class="reader-page hidden">
        <div class="reader-nav">
            <button id="readerBackBtn" class="nav-btn">← Quay lại</button>
            <div class="chapter-indicator-wrap">
                <button id="currentChapterBtn" class="chapter-indicator">Chương ...</button>
                <div id="chapterDropdown" class="chapter-dropdown"></div>
            </div>
            <div style="flex:1"></div>
            <button id="readerPrevBtn" class="nav-btn" disabled>❮ Trước</button>
            <button id="readerNextBtn" class="nav-btn" disabled>Sau ❯</button>
        </div>

        <div id="readerContainer" class="reader-full-container"></div>

        <button id="readerScrollTop" class="reader-scroll-top">↑</button>
        <div id="readerProgress" class="reader-progress"></div>
        <button id="readerLoadModeBtn" class="reader-load-mode">Chế độ tải: Tuần tự</button>
    </div>

    <!-- Settings Modal: Removed (Generated by settings.js) -->

    <!-- Plyr Player -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

    <!-- HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

    <!-- JavaScript -->
    <script src="js/core/config.js?v=20"></script>
    <script src="js/core/api.js?v=20"></script>
    <script src="js/core/player.js?v=20"></script>

    <!-- Services/Pages -->
    <script src="js/pages/history.js?v=21"></script>
    <script src="js/pages/watch.js?v=21"></script>
    <script src="js/pages/bookmarks.js?v=20"></script>
    <script src="js/pages/settings.js?v=22"></script>
    <script src="js/pages/filter.js?v=1"></script>
    <script src="js/pages/detail.js?v=21"></script>

    <!-- Components -->
    <script src="js/components/notification.js?v=20"></script>
    <script src="js/core/ui.js?v=23"></script> <!-- Was components.js -->
    <script src="js/components/slider.js?v=20"></script>
    <script src="js/core/theme.js?v=20"></script>
    <script src="js/core/gestures.js?v=1"></script>
    <script src="js/components/search.js?v=20"></script>

    <!-- Main -->
    <script src="js/core/main.js?v=21"></script> <!-- Was app.js -->
    <script src="js/core/protect.js"></script>
</body>

</html>
